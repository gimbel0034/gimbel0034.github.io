<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Mental Health Safety Plan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #222;
    }

    header {
      background: #3b6ba5;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    section {
      margin-bottom: 25px;
    }

    section h2 {
      margin-bottom: 10px;
      font-size: 1.3rem;
      color: #3b6ba5;
    }

    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
    }

    textarea, input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .small-input {
      width: 48%;
      display: inline-block;
      box-sizing: border-box;
    }

    .small-input + .small-input {
      margin-left: 4%;
    }

    .contact-card {
      background: #f0f5ff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .buttons {
      text-align: right;
      margin-top: 15px;
    }

    button {
      padding: 8px 14px;
      margin-left: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .save-btn {
      background: #3b6ba5;
      color: #fff;
    }

    .clear-btn {
      background: #999;
      color: #fff;
    }

    .emergency {
      background: #ffe8e8;
      border-left: 4px solid #d9534f;
      padding: 10px;
      border-radius: 6px;
    }

    .emergency strong {
      color: #d9534f;
    }
